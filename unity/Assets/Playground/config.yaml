behaviors:
  gewu:
    checkpoint_interval: 400000
    hyperparameters: {batch_size: 2048, beta: 0.005, beta_schedule: linear, buffer_size: 20480,
      epsilon: 0.2, epsilon_schedule: linear, lambd: 0.95, learning_rate: 0.0003,
      learning_rate_schedule: linear, num_epoch: 3}
    keep_checkpoints: 5
    max_steps: 20000000
    network_settings: {deterministic: false, goal_conditioning_type: hyper, hidden_units: 512,
      normalize: true, num_layers: 3, vis_encode_type: simple}
    reward_signals:
      extrinsic:
        gamma: 0.995
        network_settings: {deterministic: false, goal_conditioning_type: hyper, hidden_units: 128,
          normalize: false, num_layers: 2, vis_encode_type: simple}
        strength: 1.0
    summary_freq: 20000
    threaded: false
    time_horizon: 1000
    trainer_type: ppo

# 课程学习配置：根据累积奖励自动提升平台晃动幅度
# 需要在 Unity Inspector 中将 PlatformMotionController 的参数设置为接收这些值
# 建议在 PlatformMotionController 中通过 Academy.Instance.EnvironmentParameters 获取
environment_parameters:
  platform_roll_amplitude:
    curriculum:
      - name: stage1_static
        completion_criteria:
          measure: reward
          behavior: gewu
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1000
        value: 0.0
      - name: stage2_1degree
        completion_criteria:
          measure: reward
          behavior: gewu
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1500
        value: 1.0
      - name: stage3_2degree
        completion_criteria:
          measure: reward
          behavior: gewu
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1800
        value: 2.0
      - name: stage4_3degree
        value: 3.0
